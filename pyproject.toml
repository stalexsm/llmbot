[project]
name = "telegram-llm-bot"
version = "0.1.0"
description = "Telegram bot backed by a local LLM through Ollama"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.19.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.52",
    "sqlite-vec>=0.1.9",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Живые тесты против настоящего Ollama (tests/live, маркер live) из дефолтного
# прогона исключены: гейты зелёные без запущенной модели. Явный запуск —
# `uv run pytest -m live` (поздний -m из CLI перекрывает addopts).
addopts = '-m "not live"'
markers = [
    "live: живой тест против настоящего Ollama; по умолчанию исключён, запуск: uv run pytest -m live",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "T20",   # flake8-print
    "RUF",   # ruff-specific rules
]
ignore = [
    # User-facing texts are Russian; ambiguous-unicode rules fire on Cyrillic.
    "RUF001",
    "RUF002",
    "RUF003",
]
